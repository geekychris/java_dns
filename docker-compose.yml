version: '3.8'

services:
  javadns:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: javadns:latest
    container_name: javadns-server
    restart: unless-stopped
    ports:
      - "8080:8080"  # REST API
      - "5353:5353/udp"  # DNS Server
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:+UseG1GC
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./dns-records.txt:/app/dns-records.txt:ro
      - ./logs:/app/logs
    networks:
      - javadns-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.example.service=javadns"
      - "com.example.version=1.0.0"

  # Optional: DNS monitoring with dig
  dns-test:
    image: alpine:latest
    container_name: javadns-test-client
    profiles: ["testing"]
    depends_on:
      - javadns
    command: >
      sh -c "
        apk add --no-cache bind-tools curl &&
        while true; do
          echo '=== DNS Test Results ===' &&
          dig @javadns -p 5353 google.com &&
          dig @javadns -p 5353 test.example.com &&
          echo '=== REST API Test ===' &&
          curl -s http://javadns:8080/actuator/health | head -5 &&
          echo '' &&
          sleep 60
        done
      "
    networks:
      - javadns-network

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: javadns-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - javadns
    networks:
      - javadns-network

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: javadns-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - javadns-network

networks:
  javadns-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data: