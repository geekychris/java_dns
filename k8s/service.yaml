---
apiVersion: v1
kind: Service
metadata:
  name: javadns-http-service
  namespace: default
  labels:
    app: javadns
    service: http
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: javadns

---
apiVersion: v1
kind: Service
metadata:
  name: javadns-dns-service
  namespace: default
  labels:
    app: javadns
    service: dns
spec:
  type: LoadBalancer
  ports:
  - name: dns-udp
    port: 53
    targetPort: 5353
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 5353
    protocol: TCP
  selector:
    app: javadns
  # For cloud load balancers that support UDP
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
  #   service.beta.kubernetes.io/azure-load-balancer-udp-idle-timeout: "4"

---
apiVersion: v1
kind: Service
metadata:
  name: javadns-headless
  namespace: default
  labels:
    app: javadns
    service: headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: dns-udp
    port: 5353
    targetPort: 5353
    protocol: UDP
  selector:
    app: javadns